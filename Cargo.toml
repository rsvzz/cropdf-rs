[package]
name = "cropdf"
version = "0.1.1"
edition = "2024"
rust-version = "1.91.0"

[dependencies]
cairo = {package = "cairo-rs", version = "0.21.5", features = ["pdf"]}

[lib]
crate-type = ["rlib", "cdylib"]

[profile.release]
opt-level = "z"
lto = true
incremental = false
codegen-units = 1
strip = true
panic = "abort"

